<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so the page reaches under a phone's rounded corners,
		     with safe-area insets doing the actual keeping-out-of-the-way -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#191722" />
		<!-- added to a phone home screen this opens without browser chrome -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>guildhall</title>
		<!-- app.css is the shell — palette, header, settings, room frame. list.css is
		     the session list, which is the whole app on a phone. Split because one
		     file had reached the repo's 500-line ceiling, and they change for
		     different reasons. Order matters: list.css overrides the reduced-motion
		     rule app.css sets globally. -->
		<link rel="stylesheet" href="/app.css" />
		<link rel="stylesheet" href="/list.css" />
	</head>
	<body>
		<header id="bar">
			<span class="brand">GUILDHALL</span>
			<!-- version sits with the name, as it does in the terminal, so a tab left
			     open for a week is as obviously stale here as it is there -->
			<span id="ver" class="ver"></span>
			<span id="counts" class="counts"></span>
			<span id="link" class="link" title="connection"></span>
			<!-- The panel is built from the spec in settings.ts rather than written
			     out here, so adding an option never means editing two files. -->
			<button id="gear" class="gear" type="button" aria-expanded="false" aria-controls="settings" title="Settings">⚙</button>
			<div id="settings" class="settings" role="dialog" aria-label="Settings" hidden></div>
		</header>

		<!-- Shown when the feed has stopped. The numbers below it are real but old,
		     and a dashboard that cannot say which is worse than one that says
		     nothing — so it names the age and the likely reason. -->
		<p id="offline" class="offline" hidden></p>

		<!-- The room only appears where there is room for it. On a phone the office
		     at 100 columns is illegible, and the list is the answer to "what is the
		     status", which is the question the phone is being asked. -->
		<main id="room" hidden><canvas id="canvas"></canvas></main>

		<ul id="list" class="list"></ul>

		<p id="empty" class="empty" hidden>No live sessions.</p>

		<footer id="foot">
			<span id="stamp"></span>
			<span class="ro">read-only</span>
		</footer>

		<script type="module" src="/app.js"></script>
	</body>
</html>
