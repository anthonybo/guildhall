<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so the page reaches under a phone's rounded corners,
		     with safe-area insets doing the actual keeping-out-of-the-way -->
		<!-- `interactive-widget=resizes-content` was here and has been removed. It is
		     the right idea — the keyboard should shrink the viewport rather than slide
		     the page under itself — but WebKit does not implement it, so on the phone
		     this is actually read from it did nothing while looking like the fix. The
		     keyboard is handled in terminal.ts against visualViewport instead, which
		     works on both engines.
		     Deliberately NO maximum-scale: iOS ignores it, and suppressing zoom on a
		     view made of small text is the wrong thing to take away. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- A tab with no icon is the one that looks broken in a strip of twenty. SVG
		     because the whole app is vector-crisp pixel art and it scales to whatever
		     size a browser asks for. There is already a `theme-color` below. -->
		<link rel="icon" type="image/svg+xml" href="icon.svg" />
		<link rel="apple-touch-icon" href="icon.svg" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#191722" />
		<!-- added to a phone home screen this opens without browser chrome -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>guildhall</title>
		<!-- Generated from web/src.css by `npm run build`. Never edit it. -->
		<link rel="stylesheet" href="/app.css" />
	</head>
	<!-- the insets keep the page clear of the notch and the home indicator -->
	<body
		class="m-0 bg-bg font-mono text-[15px] leading-[1.45] text-label [-webkit-text-size-adjust:100%] pt-[env(safe-area-inset-top)] pr-[env(safe-area-inset-right)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)]"
	>
		<!-- Wraps under 560px so the counts can take a row of their own: six of them
		     cannot share a line with the wordmark, the version and the connection
		     dot on a phone, and squeezing them onto one wrapped the header into
		     three ragged rows. -->
		<header
			id="bar"
			class="sticky top-0 z-[2] flex flex-nowrap items-center gap-2 border-b border-line bg-bg/92 px-3.5 py-2 backdrop-blur-[8px] min-[560px]:gap-3 min-[560px]:py-2.5"
		>
			<span class="font-bold tracking-[0.06em] text-gold">GUILDHALL</span>
			<!-- version sits with the name, as it does in the terminal, so a tab left
			     open for a week is as obviously stale here as it is there -->
			<span id="ver" class="hidden text-[0.78rem] whitespace-nowrap text-faint min-[420px]:inline"></span>
			<!-- order-3/basis-full below 560px is what gives the counts their own row -->
			<!--
			  The counts are the reason the header exists on a phone: the one question it
			  answers is whether anything needs you. They used to be given a row of their
			  own below 560px (`order-3 basis-full`), which is what made the bar three
			  ragged lines and 102px tall on a 366px screen — a third of the visible list.

			  Now they stay inline and shrink instead. `min-w-0` lets them, and the
			  overflow scrolls rather than wrapping: with seven states at once no
			  arrangement fits one line, and a bar that silently changes height is worse
			  than one you can nudge sideways in the rare case.
			-->
			<span id="counts" class="flex min-w-0 items-center gap-x-2.5 overflow-x-auto text-[0.8rem] text-muted [scrollbar-width:none] [&::-webkit-scrollbar]:hidden min-[560px]:gap-3 min-[560px]:overflow-visible min-[560px]:text-[0.82rem]"></span>
			<span id="link" class="ml-auto flex items-center gap-1.5 text-xs whitespace-nowrap text-faint" title="connection"></span>
			<!-- The panel is built from the spec in settings.ts rather than written
			     out here, so adding an option never means editing two files. -->
			<!-- Commits and deploys, from pressroom. Beside the gear because it is the
			     other thing you might want that is not a session. Called "pressroom"
			     rather than anything cleverer: it is the same tool you already run in a
			     terminal, and a second name for one thing is only friction. -->
			<!--
			  Label below the icon's breakpoint, icon above it. `aria-label` carries the
			  name at BOTH widths, so hiding the text never hides the meaning from a
			  screen reader — and the marks are drawn on the same 16-unit crisp-edge grid
			  as the CRT sprite in list.ts, because this app already has an icon language
			  and a stray Unicode character is not part of it.
			-->
			<button
				id="newbtn"
				class="cursor-pointer rounded border border-line bg-transparent text-[0.74rem] whitespace-nowrap text-muted hover:border-gold hover:text-gold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gold inline-flex items-center justify-center gap-1.5 min-h-8 min-w-8 px-1.5 min-[560px]:px-2 min-[560px]:py-0.5"
				type="button"
				aria-label="Start a new Claude Code session"
				title="Start a new Claude Code session"
			>
				<svg viewBox="0 0 16 16" width="13" height="13" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><rect x="7" y="3" width="2" height="10"/><rect x="3" y="7" width="10" height="2"/></svg><span class="hidden min-[560px]:inline">session</span>
			</button>
			<button
				id="pressbtn"
				class="cursor-pointer rounded border border-line bg-transparent text-[0.74rem] whitespace-nowrap text-muted hover:border-gold hover:text-gold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gold inline-flex items-center justify-center gap-1.5 min-h-8 min-w-8 px-1.5 min-[560px]:px-2 min-[560px]:py-0.5 aria-expanded:border-gold aria-expanded:text-gold"
				type="button"
				aria-expanded="false"
				aria-controls="press"
				aria-label="Pressroom — commits and deploys across your projects"
				title="Commits and deploys across your projects"
			>
				<svg viewBox="0 0 16 16" width="13" height="13" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><rect x="2" y="2" width="12" height="1"/><rect x="2" y="13" width="12" height="1"/><rect x="2" y="2" width="1" height="12"/><rect x="13" y="2" width="1" height="12"/><rect x="4" y="5" width="8" height="1"/><rect x="4" y="8" width="8" height="1"/><rect x="4" y="11" width="5" height="1"/></svg><span class="hidden min-[560px]:inline">pressroom</span>
			</button>
			<!-- Was the character ⚙, which is a different weight and baseline in every
			     font it lands in. Drawn to match the other two. -->
			<button
				id="gear"
				class="cursor-pointer inline-flex min-h-8 min-w-8 items-center justify-center rounded border-0 bg-transparent text-faint hover:text-gold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gold aria-expanded:text-gold"
				type="button"
				aria-expanded="false"
				aria-controls="settings"
				aria-label="Settings"
				title="Settings"
			>
				<svg viewBox="0 0 16 16" width="13" height="13" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><rect x="2" y="4" width="12" height="1"/><rect x="5" y="2" width="2" height="5"/><rect x="2" y="11" width="12" height="1"/><rect x="9" y="9" width="2" height="5"/></svg>
			</button>
			<div
				id="settings"
				class="absolute top-[calc(100%+0.4rem)] right-3.5 z-[3] w-[min(21rem,calc(100vw-1.8rem))] rounded-lg border border-line bg-panel p-3.5 shadow-[0_10px_30px_rgb(0_0_0/45%)]"
				role="dialog"
				aria-label="Settings"
				hidden
			></div>
		</header>

		<!-- Shown when the feed has stopped. The numbers below it are real but old,
		     and a dashboard that cannot say which is worse than one that says
		     nothing — so it names the age and the likely reason. -->
		<p
			id="offline"
			class="m-0 border-b border-[color-mix(in_srgb,var(--color-gold)_35%,var(--color-line))] bg-[color-mix(in_srgb,var(--color-gold)_12%,var(--color-bg))] px-3.5 py-2.5 text-[0.78rem]/[1.45] text-gold"
			hidden
		></p>

		<!-- The room only appears where there is room for it. On a phone the office
		     at 100 columns is illegible, and the list is the answer to "what is the
		     status", which is the question the phone is being asked. Hidden outright
		     below 720px rather than shrunk. -->
		<main id="room" class="px-3.5 pt-3.5 max-[720px]:hidden!" hidden>
			<!-- The canvas is drawn at device resolution and the upscale happens inside
			     it, with smoothing off, so the pixels stay hard AND the labels stay
			     type. Letting CSS do the scaling stretched the glyphs along with the art. -->
			<canvas id="canvas" class="block w-full rounded-md border border-line"></canvas>
		</main>

		<!-- The live terminal for one session, with a box to type into it. Empty
		     until a row's terminal button is pressed, and built by terminal.ts. -->
		<!-- On a phone this is the whole screen, not a panel in a page. A terminal you
		     are reading IS the task, and sharing the glass with a list you are not
		     looking at costs the rows that matter. Above 880px it stays inline, where
		     there is room for both. `dvh` rather than `vh` so the on-screen keyboard
		     shrinks it instead of pushing the input under the keyboard. -->
		<section
			id="terminal"
			class="overflow-hidden border-gold/50 bg-panel max-[880px]:fixed max-[880px]:inset-0 max-[880px]:z-[6] max-[880px]:flex max-[880px]:h-[100dvh] max-[880px]:flex-col max-[880px]:pt-[env(safe-area-inset-top)] max-[880px]:pb-[env(safe-area-inset-bottom)] min-[880px]:mx-3.5 min-[880px]:mt-2.5 min-[880px]:rounded-md min-[880px]:border"
			hidden
		></section>

		<!-- Commits, pushes, workflow runs and Cloudflare deploys, read from pressroom.
		     Over the page rather than in it: full screen on a phone, a drawer down the
		     right on a desktop. Inline it was something you scrolled past on the way
		     somewhere else. Empty until the header button asks for it.
		     The insets keep it clear of the notch and the home indicator, since at
		     this size it is the whole window. -->
		<!-- Pick a project and start a session in it. Full screen on a phone, which is
		     where this gets used: the idea arrives away from the machine. -->
		<section
			id="newsession"
			class="fixed inset-0 z-[7] flex flex-col border-line bg-panel pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] shadow-[0_0_60px_rgb(0_0_0/60%)] min-[880px]:inset-y-0 min-[880px]:right-0 min-[880px]:left-auto min-[880px]:w-[min(30rem,72vw)] min-[880px]:border-l"
			aria-label="Start a new session"
			hidden
		></section>

		<section
			id="press"
			class="fixed inset-0 z-[5] flex flex-col border-line bg-panel pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] shadow-[0_0_60px_rgb(0_0_0/60%)] min-[880px]:inset-y-0 min-[880px]:right-0 min-[880px]:left-auto min-[880px]:w-[min(52rem,72vw)] min-[880px]:border-l"
			aria-label="Commits and deploys"
			hidden
		></section>

		<ul id="list" class="list m-0 grid list-none gap-2 px-3.5 pt-2.5"></ul>

		<p id="empty" class="px-3.5 py-8 text-center text-faint" hidden>No live sessions.</p>

		<footer id="foot" class="mt-3.5 flex gap-3 border-t border-line px-3.5 py-4 text-[0.78rem] text-faint">
			<span id="stamp"></span>
			<span class="ml-auto">read-only</span>
		</footer>

		<script type="module" src="/app.js"></script>
	</body>
</html>
